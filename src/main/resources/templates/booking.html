<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Бронирование | Лесной берег</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            min-height:100vh;

            font-family:'Segoe UI',sans-serif;

            background:
                    linear-gradient(
                            rgba(0,0,0,.45),
                            rgba(0,0,0,.55)
                    ),
                    url("https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8")
                    center/cover fixed;

            padding:30px;

        }



        .booking-card{

            max-width:900px;

            margin:auto;

            background:rgba(255,255,255,.9);

            backdrop-filter:blur(15px);

            border-radius:30px;

            padding:45px;

            box-shadow:
                    0 25px 60px rgba(0,0,0,.25);

        }



        h1{

            font-weight:800;

            color:#163020;

        }



        .room-card{

            border-radius:25px;

            overflow:hidden;

            cursor:pointer;

            transition:.3s;

            border:3px solid transparent;

            background:white;

        }



        .room-card:hover{

            transform:translateY(-8px);

        }



        .room-card.active{

            border:3px solid #d6a354;

            box-shadow:
                    0 10px 30px rgba(214,163,84,.4);

        }



        .room-card img{

            width:100%;

            height:180px;

            object-fit:cover;

        }



        .room-body{

            padding:20px;

        }



        .price{

            color:#b8863c;

            font-size:22px;

            font-weight:700;

        }



        .form-control{

            border-radius:15px;

            padding:14px;

            border:none;

            box-shadow:
                    inset 0 0 10px rgba(0,0,0,.08);

        }



        label{

            font-weight:600;

            color:#163020;

        }



        .btn-book{

            background:#d6a354;

            border:none;

            border-radius:50px;

            padding:15px;

            font-size:20px;

            font-weight:600;

            color:white;

        }



        .btn-book:hover{

            background:#b8863c;

        }



        .back{

            text-decoration:none;

            color:#163020;

            font-weight:600;

        }



    </style>


</head>


<body>



<div class="booking-card">



    <div class="text-center mb-5">


        <h1>
            🏡 Бронирование
        </h1>


        <p class="fs-5 text-muted">
            Гостевой дом "Лесной берег"
        </p>


    </div>





    <h3 class="mb-4">
        Выберите номер
    </h3>



    <div class="row g-4 mb-5">



        <div class="col-md-4"
             th:each="room : ${rooms}">


            <div class="room-card"
                 th:data-id="${room.id}"
                 onclick="selectRoom(this)">



                <img th:src="${room.image}"
                     alt="room">



                <div class="room-body">


                    <h4 th:text="${room.name}">
                    </h4>


                    <p th:text="${room.description}">
                    </p>


                    <div>

                        👥

                        <span th:text="${room.capacity}">
</span>

                        мест

                    </div>



                    <div class="price">


<span th:text="${room.price}">
</span>

                        ₽ / сутки


                    </div>


                </div>


            </div>


        </div>



    </div>





    <form id="bookingForm">



        <input type="hidden"
               id="roomId">





        <div class="mb-3">


            <label>
                Ваше имя
            </label>


            <input class="form-control"
                   id="clientName"
                   placeholder="Иван Петров"
                   required>


        </div>





        <div class="mb-3">


            <label>
                Телефон
            </label>


            <input class="form-control"
                   id="phone"
                   placeholder="+7 999 000-00-00"
                   required>


        </div>





        <div class="row">


            <div class="col-md-6 mb-3">


                <label>
                    Заезд
                </label>


                <input type="date"
                       class="form-control"
                       id="dateFrom"
                       required>


            </div>




            <div class="col-md-6 mb-3">


                <label>
                    Выезд
                </label>


                <input type="date"
                       class="form-control"
                       id="dateTo"
                       required>


            </div>


        </div>





        <button class="btn btn-book w-100 mt-3">

            Забронировать 🌿

        </button>



    </form>





    <div id="result"
         class="text-center mt-4 fw-bold">


    </div>





    <div class="text-center mt-4">


        <a href="/"
           class="back">

            ← Вернуться на главную

        </a>


    </div>



</div>







<script>


    function selectRoom(card){


        document.querySelectorAll(".room-card")
            .forEach(c=>{
                c.classList.remove("active");
            });


        card.classList.add("active");


        document.getElementById("roomId")
            .value =
            card.dataset.id;


    }





    document
        .getElementById("bookingForm")
        .addEventListener("submit", async function(e){


            e.preventDefault();



            const roomId =
                document.getElementById("roomId").value;



            if(!roomId){


                document.getElementById("result").innerHTML =
                    "❗ Выберите номер";


                return;

            }




            const booking={


                clientName:
                document.getElementById("clientName").value,


                phone:
                document.getElementById("phone").value,


                dateFrom:
                document.getElementById("dateFrom").value,


                dateTo:
                document.getElementById("dateTo").value,


                room:{
                    id:roomId
                }


            };

            const response =
                await fetch(
                    "/api/bookings",
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":"application/json",
                            "X-XSRF-TOKEN": getCookie("XSRF-TOKEN")
                        },
                        body:JSON.stringify(booking)
                    });

            function getCookie(name){

                let cookieValue = null;

                if(document.cookie && document.cookie !== ""){

                    const cookies = document.cookie.split(";");

                    for(let i = 0; i < cookies.length; i++){

                        const cookie = cookies[i].trim();

                        if(cookie.startsWith(name + "=")){

                            cookieValue = decodeURIComponent(
                                cookie.substring(name.length + 1)
                            );

                            break;
                        }
                    }
                }

                return cookieValue;

            }

            if(response.ok){
                window.location.href="/thank-you";
            }

            else{


                document.getElementById("result").innerHTML =
                    "❌ Ошибка отправки";


            }



        });



</script>



</body>

</html>
