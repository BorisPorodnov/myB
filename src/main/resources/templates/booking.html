<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Запись | Beauty Studio Luna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        font-family:'Segoe UI',sans-serif;
        min-height:100vh;
        padding:30px;
        background:
                linear-gradient(
                        rgba(0,0,0,.45),
                        rgba(0,0,0,.55)
                ),
                url("https://images.unsplash.com/photo-1560066984-138dadb4c035")
                center/cover fixed;
    }

    .booking-card{
        max-width:950px;
        margin:auto;
        background:rgba(255,255,255,.92);
        backdrop-filter:blur(15px);
        border-radius:35px;
        padding:45px;
        box-shadow:0 30px 70px rgba(0,0,0,.3);
    }

    h1{
        font-weight:900;
        color:#4b2435;
    }

    .service-card{
        background:white;
        border-radius:25px;
        overflow:hidden;
        cursor:pointer;
        border:3px solid transparent;
        transition:.3s;
        height:100%;
    }

    .service-card:hover{
        transform:translateY(-10px);
    }

    .service-card.active{
        border-color:#d47b9b;
        box-shadow:0 15px 40px rgba(212,123,155,.4);
    }

    .service-card img{
        width:100%;
        height:220px;
        object-fit:cover;
    }

    .service-body{
        padding:25px;
    }

    .price{
        font-size:22px;
        font-weight:800;
        color:#d47b9b;
    }

    .form-control{
        border-radius:18px;
        padding:15px;
        border:none;
        background:#faf7f5;
        box-shadow:inset 0 0 10px rgba(0,0,0,.08);
    }

    label{
        font-weight:700;
        color:#4b2435;
    }

    .btn-book{
        background:#d47b9b;
        color:white;
        border:none;
        border-radius:50px;
        padding:18px;
        font-size:20px;
        font-weight:700;
    }

    .btn-book:hover{
        background:#b85f80;
    }

    .back{
        color:#4b2435;
        font-weight:700;
        text-decoration:none;
    }

</style>


<div class="booking-card">


    <div class="text-center mb-5">

        <h1>
            💅 Beauty Studio Luna
        </h1>

        <p class="fs-5 text-muted">
            Запись на процедуру онлайн
        </p>

    </div>


    <h3 class="mb-4">
        Выберите услугу
    </h3>


    <div class="row g-4 mb-5">


        <div class="col-md-4">

            <div class="service-card"
                 onclick="selectService(this,'Маникюр')">

                <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371">

                <div class="service-body">

                    <h4>
                        💅 Маникюр
                    </h4>

                    <p>
                        Уход за руками, форма ногтей, красивый дизайн
                    </p>

                    <div class="price">
                        от 1500 ₽
                    </div>

                </div>

            </div>

        </div>




        <div class="col-md-4">

            <div class="service-card"
                 onclick="selectService(this,'Педикюр')">

                <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b">

                <div class="service-body">

                    <h4>
                        🦶 Педикюр
                    </h4>

                    <p>
                        Красивые и ухоженные ножки каждый сезон
                    </p>

                    <div class="price">
                        от 2000 ₽
                    </div>

                </div>

            </div>

        </div>




        <div class="col-md-4">

            <div class="service-card"
                 onclick="selectService(this,'Покрытие гель-лак')">

                <img src="https://images.unsplash.com/photo-1610992015732-2449b76344bc">

                <div class="service-body">

                    <h4>
                        ✨ Покрытие
                    </h4>

                    <p>
                        Гель-лак, укрепление и стойкий результат
                    </p>

                    <div class="price">
                        от 1200 ₽
                    </div>

                </div>

            </div>

        </div>


    </div>



    <form id="bookingForm">


        <input type="hidden"
               id="service">



        <div class="mb-3">

            <label>
                Ваше имя
            </label>

            <input class="form-control"
                   id="clientName"
                   placeholder="Анна"
                   required>

        </div>



        <div class="mb-3">

            <label>
                Телефон WhatsApp
            </label>

            <input class="form-control"
                   id="phone"
                   placeholder="+7 999 000-00-00"
                   required>

        </div>



        <div class="row">


            <div class="col-md-6 mb-3">

                <label>
                    Дата
                </label>

                <input type="date"
                       class="form-control"
                       id="date"
                       required>

            </div>



            <div class="col-md-6 mb-3">

                <label>
                    Свободное время
                </label>

                <input type="time"
                       class="form-control"
                       id="time"
                       required>

            </div>


        </div>



        <button class="btn btn-book w-100">

            Записаться 💕

        </button>


    </form>



    <div id="result"
         class="text-center mt-4 fw-bold">

    </div>



    <div class="text-center mt-4">

        <a href="/" class="back">
            ← Вернуться на главную
        </a>

    </div>


</div>



<script>

    let selectedService = null;
    function selectService(element, service){

        document.querySelectorAll(".service-card")
            .forEach(card=>{
                card.classList.remove("active");
            });

        element.classList.add("active");
        selectedService = service;
        document.getElementById("service").value = service;
    }



    document
        .getElementById("bookingForm")
        .addEventListener("submit", function(e){
            e.preventDefault();
            let booking = {
                clientName:
                document.getElementById("clientName").value,
                phone:
                document.getElementById("phone").value,
                service:
                document.getElementById("service").value,
                date:
                document.getElementById("date").value,
                time:
                document.getElementById("time").value

            };



            fetch("/api/bookings",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:
                    JSON.stringify(booking)

            })
                .then(response=>response.json())
                .then(data=>{
                    window.location.href="/thank-you";
                })
                .catch(error=>{
                    document.getElementById("result").innerHTML=
                        "❌ Ошибка. Попробуйте позже";
                });



        });


</script>
