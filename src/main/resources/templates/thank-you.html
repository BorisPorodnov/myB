<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Спасибо | Luna Beauty</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;

        font-family:'Segoe UI',sans-serif;

        background:
                linear-gradient(
                        rgba(0,0,0,.45),
                        rgba(0,0,0,.6)
                ),
                url("https://images.unsplash.com/photo-1560066984-138dadb4c035")
                center/cover;
    }


    .card-success{

        max-width:600px;
        width:100%;

        background:rgba(255,255,255,.92);

        backdrop-filter:blur(15px);

        border-radius:35px;

        padding:50px;

        text-align:center;

        box-shadow:
                0 25px 60px rgba(0,0,0,.35);

    }


    .icon{

        font-size:85px;

    }


    h1{

        color:#4b2435;

        font-weight:800;

    }


    .info{

        margin-top:30px;

        background:#faf0f4;

        border-radius:25px;

        padding:30px;

        text-align:left;

    }


    .service{

        font-size:26px;

        font-weight:800;

        color:#d47b9b;

    }


    .time{

        font-size:20px;

        font-weight:700;

        color:#4b2435;

    }


    .btn-main{

        background:#d47b9b;

        border:none;

        border-radius:50px;

        padding:15px 40px;

        color:white;

    }


    .btn-main:hover{

        background:#b85f80;

    }


    .whatsapp{

        background:#25D366;

        color:white;

        border-radius:50px;

        padding:15px 35px;

        text-decoration:none;

        display:inline-block;

        margin-top:15px;

        font-weight:700;

    }

</style>


<div class="card-success">


    <div class="icon">

        💅

    </div>


    <h1>

        Спасибо за запись!

    </h1>


    <p class="fs-5">

        Ваша заявка успешно отправлена.

        <br>

        Мастер скоро свяжется с вами.

    </p>



    <div class="info"
         th:if="${booking}">


        <div class="service">

            ✨

            <span th:text="${booking.service}">
</span>

        </div>


        <hr>


        <p>

            📅

            <b>Дата:</b>

            <span th:text="${booking.date}">
</span>

        </p>


        <p>

            🕒

            <b>Время:</b>

            <span th:text="${booking.time}">
</span>

        </p>


        <p>

            👤

            <b>Клиент:</b>

            <span th:text="${booking.clientName}">
</span>

        </p>


    </div>



    <p class="mt-4 text-muted">

        Студия красоты Luna

        <br>

        Красота начинается с заботы ✨

    </p>



    <a href="https://wa.me/79990000000"
       class="whatsapp">

        💬 Написать мастеру

    </a>


    <br>


    <a href="/"
       class="btn btn-main mt-3">

        ← На главную

    </a>


</div>
