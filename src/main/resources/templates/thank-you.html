<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Спасибо | Лесной берег
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:20px;

            font-family:'Segoe UI',sans-serif;

            background:
                    linear-gradient(
                            rgba(0,0,0,.45),
                            rgba(0,0,0,.55)
                    ),
                    url("https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8")
                    center/cover;

        }


        .card-success{

            max-width:600px;

            width:100%;

            background:
                    rgba(255,255,255,.9);

            backdrop-filter:blur(15px);

            border-radius:30px;

            padding:50px;

            text-align:center;

            box-shadow:
                    0 25px 50px rgba(0,0,0,.3);

        }


        .icon{

            font-size:80px;

        }


        h1{

            color:#163020;

            font-weight:800;

        }


        .booking-info{

            margin-top:30px;

            background:#f3f6f4;

            border-radius:25px;

            padding:25px;

            text-align:left;

        }


        .room-name{

            font-size:24px;

            font-weight:700;

            color:#163020;

        }


        .price{

            color:#b8863c;

            font-size:24px;

            font-weight:700;

        }


        .btn-home{

            background:#d6a354;

            border:none;

            border-radius:50px;

            padding:15px 40px;

        }


        .btn-home:hover{

            background:#b8863c;

        }


    </style>

</head>


<body>


<div class="card-success">


    <div class="icon">

        🌲

    </div>


    <h1>

        Спасибо за заявку!

    </h1>


    <p class="fs-5 mt-3">

        Мы получили ваше бронирование.

        <br>

        Наш администратор скоро свяжется с вами.

    </p>



    <div class="booking-info"
         th:if="${booking}">


        <div class="room-name">

            🏡

            <span th:text="${booking.room.name}">
            </span>

        </div>


        <hr>


        <p>

            📅

            <b>Заезд:</b>

            <span th:text="${booking.dateFrom}">
            </span>

        </p>


        <p>

            📅

            <b>Выезд:</b>

            <span th:text="${booking.dateTo}">
            </span>

        </p>


        <p class="price">

            💰

            <span th:text="${booking.room.price}">
            </span>

            ₽ / сутки

        </p>


    </div>



    <p class="text-muted mt-4">

        Гостевой дом "Лесной берег"

    </p>



    <a href="/"
       class="btn btn-home text-white mt-3">

        ← Вернуться на главную

    </a>


</div>


</body>

</html>
