<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Админка | Записи Beauty Studio
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f8f4f7;

            font-family:'Segoe UI',sans-serif;

        }


        .header{

            background:#8b5e83;

            color:white;

            padding:30px;

            border-radius:0 0 30px 30px;

        }


        .card-box{

            background:white;

            border-radius:30px;

            padding:30px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,.08);

        }



        thead{

            background:#8b5e83!important;

            color:white;

        }



        tbody tr{

            transition:.3s;

        }



        tbody tr:hover{

            transform:scale(1.01);

            background:#fff5fb;

        }



        .status{

            padding:8px 15px;

            border-radius:50px;

            font-weight:600;

            display:inline-block;

        }



        .new{

            background:#fff3cd;

            color:#856404;

        }



        .confirmed{

            background:#d1e7dd;

            color:#0f5132;

        }



        .cancelled{

            background:#f8d7da;

            color:#842029;

        }



        .service{

            background:#fde7f3;

            padding:10px 15px;

            border-radius:15px;

            font-weight:600;

            color:#8b5e83;

        }



        .time{

            color:#b34d88;

            font-size:18px;

            font-weight:700;

        }



        .btn{

            border-radius:50px;

        }



    </style>

</head>



<body>



<div class="header">


    <h1>

        💅 Beauty Studio

    </h1>


    <p class="mb-0">

        Управление записями клиентов

    </p>


</div>




<div class="container mt-5">


    <div class="card-box">


        <h2 class="mb-4">

            📋 Записи клиентов

        </h2>
        <div class="row mb-4">

            <div class="col-md-6">

                <input
                        id="searchInput"
                        class="form-control form-control-lg"
                        placeholder="🔍 Поиск по имени или телефону">

            </div>

            <div class="col-md-3">

                <input
                        type="date"
                        id="dateFilter"
                        class="form-control form-control-lg">

            </div>

            <div class="col-md-3">

                <button
                        class="btn btn-outline-secondary w-100 h-100"
                        onclick="resetFilters()">

                    Сбросить

                </button>

            </div>

        </div>




        <div class="table-responsive">


            <table class="table table-hover align-middle">


                <thead>


                <tr>

                    <th>
                        Клиент
                    </th>


                    <th>
                        Телефон
                    </th>


                    <th>
                        Услуга
                    </th>


                    <th>
                        Дата
                    </th>


                    <th>
                        Время
                    </th>


                    <th>
                        Статус
                    </th>


                    <th>
                        Действия
                    </th>


                </tr>


                </thead>




                <tbody>


                <tr
                        th:each="booking : ${bookings}"
                        th:attr="data-date=${booking.date}">


                    <td>

                        <b th:text="${booking.clientName}">
                        </b>

                    </td>



                    <td th:text="${booking.phone}">
                    </td>




                    <td>


                        <div class="service">

                            💅

                            <span th:text="${booking.service}">
</span>


                        </div>


                    </td>





                    <td th:text="${booking.date}">
                    </td>





                    <td>


<span class="time"
      th:text="${booking.time}">

</span>


                    </td>





                    <td>



<span class="status new"
      th:if="${booking.status.name()=='NEW'}">

🕒 Новая

</span>




                        <span class="status confirmed"
                              th:if="${booking.status.name()=='CONFIRMED'}">

✓ Подтверждена

</span>




                        <span class="status cancelled"
                              th:if="${booking.status.name()=='CANCELLED'}">

✕ Отменена

</span>



                    </td>





                    <td>



                        <div th:if="${booking.status.name()=='NEW'}"
                             class="d-flex gap-2">


                            <form th:action="@{/admin/bookings/{id}/confirm(id=${booking.id})}"
                                  method="post">


                                <button class="btn btn-success btn-sm">

                                    ✓

                                </button>


                            </form>





                            <form th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}"
                                  method="post">


                                <button class="btn btn-danger btn-sm">

                                    ✕

                                </button>


                            </form>



                        </div>




                        <span class="text-muted"
                              th:if="${booking.status.name()!='NEW'}">

обработано

</span>



                    </td>



                </tr>



                </tbody>


            </table>


        </div>



    </div>


</div>


</body>

<script>

    const searchInput =
        document.getElementById("searchInput");

    const dateFilter =
        document.getElementById("dateFilter");

    function filterRows(){

        const text =
            searchInput.value.toLowerCase();

        const date =
            dateFilter.value;

        document
            .querySelectorAll("tbody tr")
            .forEach(row=>{

                const rowText =
                    row.innerText.toLowerCase();

                const rowDate =
                    row.dataset.date;

                const matchesText =
                    rowText.includes(text);

                const matchesDate =
                    date==="" || rowDate===date;

                row.style.display =
                    matchesText && matchesDate
                        ? ""
                        : "none";

            });

    }

    searchInput.addEventListener("keyup",filterRows);

    dateFilter.addEventListener("change",filterRows);

    function resetFilters(){

        searchInput.value="";

        dateFilter.value="";

        filterRows();

    }

</script>

</html>
