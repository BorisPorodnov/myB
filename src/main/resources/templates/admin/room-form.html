<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Номер | Лесной берег
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f3f6f4;
            font-family:'Segoe UI',sans-serif;

        }


        .card-box{

            max-width:700px;

            margin:60px auto;

            background:white;

            border-radius:30px;

            padding:40px;

            box-shadow:
                    0 20px 50px rgba(0,0,0,.1);

        }


        h1{

            color:#163020;

            font-weight:800;

        }


        label{

            font-weight:600;

            color:#163020;

        }


        .form-control{

            border-radius:15px;

            padding:12px;

        }


        .btn{

            border-radius:50px;

            padding:12px 35px;

        }


    </style>


</head>


<body>



<div class="card-box">


    <h1 class="text-center mb-4">

        🏡 Номер

    </h1>



    <form th:action="@{/admin/rooms/save}"
          th:object="${room}"
          method="post">



        <input type="hidden"
               th:field="*{id}">



        <div class="mb-3">


            <label>

                Название номера

            </label>


            <input class="form-control"
                   th:field="*{name}"
                   placeholder="🌿 Стандарт">


        </div>





        <div class="mb-3">


            <label>

                Описание

            </label>


            <textarea class="form-control"
                      rows="4"
                      th:field="*{description}"
                      placeholder="Описание номера">
            </textarea>


        </div>





        <div class="row">


            <div class="col-md-6 mb-3">


                <label>

                    Цена за ночь

                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{price}"
                       placeholder="2500">


            </div>





            <div class="col-md-6 mb-3">


                <label>

                    Количество мест

                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{capacity}"
                       placeholder="2">


            </div>


        </div>





        <div class="mb-3">


            <label>

                Фото (URL)

            </label>


            <input class="form-control"
                   th:field="*{image}"
                   placeholder="https://...">


        </div>





        <div class="form-check mb-4">


            <input class="form-check-input"
                   type="checkbox"
                   th:field="*{available}">


            <label class="form-check-label">

                Доступен для бронирования

            </label>


        </div>





        <div class="text-center">


            <button class="btn btn-success">

                💾 Сохранить

            </button>



            <a href="/admin/rooms"
               class="btn btn-secondary">

                Назад

            </a>


        </div>




    </form>



</div>



</body>

</html>
