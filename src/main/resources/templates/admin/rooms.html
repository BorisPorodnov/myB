<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Номера | Админка
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f3f6f4;

            font-family:'Segoe UI',sans-serif;

        }


        .header{

            background:#163020;

            color:white;

            padding:35px;

            border-radius:0 0 30px 30px;

        }


        .card-box{

            background:white;

            border-radius:25px;

            padding:30px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,.08);

        }


        .room-card{

            border-radius:25px;

            overflow:hidden;

            box-shadow:
                    0 10px 30px rgba(0,0,0,.1);

            transition:.3s;

        }


        .room-card:hover{

            transform:translateY(-5px);

        }


        .room-card img{

            width:100%;

            height:220px;

            object-fit:cover;

        }


        .room-body{

            padding:25px;

        }


        .price{

            color:#b8863c;

            font-size:22px;

            font-weight:800;

        }


        .btn{

            border-radius:50px;

        }


    </style>


</head>


<body>


<div class="header text-center">


    <h1>

        🏡 Управление номерами

    </h1>


    <p class="mb-0">

        Добавление и редактирование комнат

    </p>


</div>



<div class="container mt-5">


    <div class="card-box">



        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2>

                📋 Список номеров

            </h2>



            <a href="/admin/rooms/new"
               class="btn btn-success">

                ➕ Добавить номер

            </a>


        </div>




        <div class="row g-4">



            <div class="col-md-4"
                 th:each="room : ${rooms}">



                <div class="room-card bg-white">



                    <img th:src="${room.image}"
                         alt="room">



                    <div class="room-body">



                        <h3
                                th:text="${room.name}">
                        </h3>




                        <p class="text-muted"
                           th:text="${room.description}">
                        </p>




                        <p>

                            👥

                            <span th:text="${room.capacity}">
                            </span>

                            мест

                        </p>




                        <div class="price">

                            <span th:text="${room.price}">
                            </span>

                            ₽ / ночь

                        </div>



                        <hr>




                        <div class="d-flex gap-2">



                            <a th:href="@{/admin/rooms/edit/{id}(id=${room.id})}"
                               class="btn btn-warning">

                                ✏ Изменить

                            </a>



                            <a th:href="@{/admin/rooms/delete/{id}(id=${room.id})}"
                               class="btn btn-danger"
                               onclick="return confirm('Удалить номер?')">

                                🗑

                            </a>



                        </div>



                    </div>


                </div>


            </div>



        </div>



    </div>


</div>



</body>

</html>
