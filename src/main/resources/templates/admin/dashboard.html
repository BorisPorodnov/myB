<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Админка | Лесной берег
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{
            background:#f3f6f4;
            font-family:'Segoe UI',sans-serif;
        }


        .header{

            background:#163020;
            color:white;
            padding:35px;
            border-radius:0 0 30px 30px;

        }


        .card-box{

            background:white;
            border-radius:25px;
            padding:30px;
            box-shadow:
                    0 15px 40px rgba(0,0,0,.08);

            transition:.3s;

        }


        .card-box:hover{

            transform:translateY(-5px);

        }


        .number{

            font-size:40px;
            font-weight:800;
            color:#163020;

        }


        .title{

            color:#777;
            font-size:18px;

        }


        .icon{

            font-size:35px;

        }


        .btn{

            border-radius:50px;
            padding:12px 30px;

        }


    </style>


</head>


<body>


<div class="header text-center">


    <h1>

        🏡 Админка "Лесной берег"

    </h1>


    <p class="mb-0">

        Управление гостями, номерами и бронированиями

    </p>


</div>




<div class="container mt-5">


    <div class="row g-4">



        <div class="col-md-3">


            <div class="card-box text-center">


                <div class="icon">
                    📋
                </div>


                <div class="number"
                     th:text="${bookingsCount}">
                </div>


                <div class="title">

                    Заявки

                </div>


            </div>


        </div>





        <div class="col-md-3">


            <div class="card-box text-center">


                <div class="icon">
                    🕒
                </div>


                <div class="number"
                     th:text="${newBookings}">
                </div>


                <div class="title">

                    Новые

                </div>


            </div>


        </div>





        <div class="col-md-3">


            <div class="card-box text-center">


                <div class="icon">
                    ✅
                </div>


                <div class="number"
                     th:text="${finishedBookings}">
                </div>


                <div class="title">

                    Подтверждены

                </div>


            </div>


        </div>





        <div class="col-md-3">


            <div class="card-box text-center">


                <div class="icon">
                    💰
                </div>


                <div class="number">

                    <span th:text="${income}">
                    </span>

                    ₽

                </div>


                <div class="title">

                    Доход

                </div>


            </div>


        </div>



    </div>





    <div class="row mt-5 g-4">



        <div class="col-md-6">


            <div class="card-box text-center">


                <h3>

                    📋 Бронирования

                </h3>


                <p class="text-muted">

                    Просмотр и обработка заявок гостей

                </p>


                <a href="/admin/bookings"
                   class="btn btn-success">

                    Открыть заявки

                </a>


            </div>


        </div>






        <div class="col-md-6">


            <div class="card-box text-center">


                <h3>

                    🏡 Номера

                </h3>


                <p class="text-muted">

                    Добавление и редактирование номеров

                </p>


                <a href="/admin/rooms"
                   class="btn btn-warning">

                    Управление номерами

                </a>


            </div>


        </div>




    </div>


</div>


</body>

</html>
