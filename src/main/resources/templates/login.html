<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        Вход администратора | Beauty Studio
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            height:100vh;

            background:
                    linear-gradient(
                            rgba(0,0,0,.5),
                            rgba(0,0,0,.6)
                    ),
                    url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9")
                    center/cover;

            display:flex;
            align-items:center;
            justify-content:center;

            font-family:'Segoe UI',sans-serif;

        }


        .login-card{

            width:400px;

            background:rgba(255,255,255,.92);

            backdrop-filter:blur(15px);

            padding:40px;

            border-radius:30px;

            box-shadow:
                    0 20px 50px rgba(0,0,0,.3);

        }


        .logo{

            font-size:55px;

            margin-bottom:10px;

        }


        h2{

            color:#8b5e83;

            font-weight:800;

        }


        .subtitle{

            color:#777;

        }


        .form-control{

            border-radius:15px;

            padding:14px;

            border:none;

            box-shadow:
                    inset 0 0 10px rgba(0,0,0,.08);

        }


        .form-control:focus{

            box-shadow:
                    0 0 0 3px rgba(214,108,168,.25);

        }


        .btn-main{

            background:#d66ca8;

            border:none;

            padding:14px;

            font-size:18px;

            font-weight:600;

        }


        .btn-main:hover{

            background:#b34d88;

        }


        .footer-text{

            color:#999;

            font-size:13px;

        }



    </style>

</head>


<body>


<div class="login-card">


    <div class="text-center">


        <div class="logo">

            💅

        </div>


        <h2>

            Beauty Studio

        </h2>


        <p class="subtitle mb-4">

            Панель управления

        </p>


    </div>



    <form method="post"
          action="/login">


        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">



        <div class="mb-3">

            <input
                    class="form-control"
                    name="username"
                    placeholder="Логин">


        </div>



        <div class="mb-3">

            <input
                    class="form-control"
                    type="password"
                    name="password"
                    placeholder="Пароль">


        </div>



        <button
                class="btn btn-main text-white w-100 rounded-pill">

            Войти 💕

        </button>



    </form>



    <div class="text-center mt-4 footer-text">

        Beauty Studio © 2026

    </div>



</div>


</body>

</html>
