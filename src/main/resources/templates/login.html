<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>Вход администратора</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        body{

            height:100vh;

            background:
                    linear-gradient(
                            rgba(0,0,0,.5),
                            rgba(0,0,0,.6)
                    ),
                    url("https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8")
                    center/cover;

            display:flex;
            align-items:center;
            justify-content:center;

        }


        .login-card{

            width:400px;

            background:white;

            padding:40px;

            border-radius:25px;

            box-shadow:
                    0 20px 50px rgba(0,0,0,.3);

        }


        .btn-main{

            background:#d6a354;
            border:none;

        }

    </style>

</head>


<body>


<div class="login-card">


    <h2 class="text-center mb-4">

        🏡 Лесной берег

    </h2>


    <p class="text-center text-muted">

        Панель управления

    </p>



    <form method="post"
          action="/login">

        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">


        <div class="mb-3">


            <input
                    class="form-control"
                    name="username"
                    placeholder="Логин">


        </div>



        <div class="mb-3">


            <input
                    class="form-control"
                    type="password"
                    name="password"
                    placeholder="Пароль">


        </div>



        <button
                class="btn btn-main text-white w-100 rounded-pill">


            Войти


        </button>


    </form>


</div>



</body>

</html>
